[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpatch-agent"
version = "0.1.0"
description = "Autonomous deterministic code repair agent built on Qwen 2.5 and Agent Skill Open Standard"
readme = "README.md"
authors = [{ name = "Surya" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pytest>=8.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
gitpatch = "main:main"